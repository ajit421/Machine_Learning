<!DOCTYPE html>
<html >

<head>
  <meta charset="UTF-8">
  <title>ML Prediction API</title>
  <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
  <link href='https://fonts.googleapis.com/css?family=Arimo' rel='stylesheet' type='text/css'>
  <link href='https://fonts.googleapis.com/css?family=Hind:300' rel='stylesheet' type='text/css'>
  <link href='https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300' rel='stylesheet' type='text/css'>

  <style>
    /* 1. Body Styling - Colorful Gradient Background */
    body {
      width: 100%;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* Purple-Blue Gradient */
      font-family: 'Arimo', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 2. Form Container - The White Box */
    .login {
      position: relative;
      background: #ffffff;
      width: 400px;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2); /* 3D Shadow effect */
      text-align: center;
    }

    /* 3. Heading Style */
    .login h1 {
      font-family: 'Pacifico', cursive;
      color: #4a4a4a;
      font-size: 32px;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    /* 4. Input Fields Style */
    input {
      width: 100%;
      padding: 10px 0;
      margin-bottom: 25px;
      border: none;
      border-bottom: 2px solid #ddd;
      outline: none;
      background: transparent;
      font-size: 16px;
      transition: 0.3s;
      box-sizing: border-box; 
      color: #333;
    }

    /* Input focus effect (line changes color) */
    input:focus {
      border-bottom: 2px solid #764ba2;
    }

    /* Placeholder color */
    ::placeholder {
      color: #999;
      opacity: 1; 
    }

    /* 5. Button Style */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      background: linear-gradient(to right, #667eea, #764ba2);
      color: white;
      font-size: 18px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px); /* Button moves up slightly */
      box-shadow: 0 7px 20px rgba(118, 75, 162, 0.6);
    }

    /* Prediction Text Style */
    .prediction-text {
      color: #764ba2;
      font-weight: bold;
      margin-top: 25px;
      font-size: 20px;
      font-family: 'Hind', sans-serif;
    }
  </style>

</head>

<body>
 <div class="login">
  <h1>House Price Prediction</h1>

     <form action="{{ url_for('predict_api')}}" method="post">
      <input type="text" name="MedInc" placeholder="Median Income" required="required" />
      <input type="text" name="HouseAge" placeholder="House Age" required="required" />
      <input type="text" name="AveRooms" placeholder="Average Rooms" required="required" />
      <input type="text" name="AveBedrms" placeholder="Average Bedrooms" required="required" />
      <input type="text" name="Population" placeholder="Population" required="required" />
      <input type="text" name="AveOccup" placeholder="Average Occupancy" required="required" />
      <input type="text" name="Latitude" placeholder="Latitude" required="required" />
      <input type="text" name="Longitude" placeholder="Longitude" required="required" />
      
      <button type="submit" class="btn btn-primary btn-block btn-large">Predict Price</button>
    </form>

   <div class="prediction-text">
       {{prediction_text}}
   </div>

 </div>
</body>
</html>
